services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nidaa
      POSTGRES_PASSWORD: nidaa
      POSTGRES_DB: nidaa
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nidaa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://nidaa:nidaa@postgres:5432/nidaa
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      PORT: 4000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    profiles: ["full"]

volumes:
  pgdata:
